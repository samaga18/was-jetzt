<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Was jetzt?</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Was jetzt?">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fff4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#241a20" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #fff4f1; --card: #ffffff; --ink: #3b2c35; --soft: #8a7480; --line: #f6dcdc;
    --accent: #e8718d; --ok: #4fa77f; --warn: #d98a3d;
    --arbeit: #dcebff; --privat: #f3e1ff; --haushalt: #e2f5d8;
    --blob: #ffd3dc; --cheek: #ff9fb5; --shadow: 0 6px 18px rgba(232, 113, 141, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #241a20; --card: #30232b; --ink: #fbeef2; --soft: #c2a9b5; --line: #45323c;
      --accent: #ff93ad; --ok: #86d6ae; --warn: #f0b070;
      --arbeit: #2c3b52; --privat: #44304f; --haushalt: #2f4430;
      --blob: #ffb9c9; --cheek: #ff7f9c; --shadow: 0 6px 18px rgba(0, 0, 0, .25);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.45 ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  main { max-width: 560px; margin: 0 auto; padding: 22px 18px 48px; }
  .eyebrow { color: var(--accent); font-weight: 600; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
  h1 { margin: 2px 0 6px; font-size: 32px; line-height: 1.15; letter-spacing: -.01em; }
  .meta { color: var(--soft); font-size: 15px; margin: 0 0 6px; }
  #meta { margin-bottom: 22px; }
  h2 { font-size: 15px; color: var(--soft); font-weight: 600; margin: 26px 0 10px; }
  .hero { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
  .hero svg { width: 76px; height: 76px; flex: none; animation: bob 3.6s ease-in-out infinite; }
  .hero h1 { margin-bottom: 0; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-5px) rotate(2deg); } }
  @media (prefers-reduced-motion: reduce) { .hero svg { animation: none; } }
  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: 22px;
    padding: 16px 17px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .tag { font-size: 13px; padding: 2px 9px; border-radius: 999px; color: var(--ink); white-space: nowrap; flex: none; }
  .tag.arbeit { background: var(--arbeit); } .tag.privat { background: var(--privat); } .tag.haushalt { background: var(--haushalt); }
  .item.done { opacity: .55; }
  .item.done .text { text-decoration: line-through; }
  .project { font-size: 14px; color: var(--soft); margin-bottom: 5px; display: flex; gap: 8px; align-items: flex-start; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--soft); }
  .dot.arbeit { background: var(--arbeit); } .dot.privat { background: var(--privat); } .dot.haushalt { background: var(--haushalt); }
  .text { font-size: 18px; font-weight: 600; line-height: 1.3; }
  .chips { margin-top: 9px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--soft); }
  .chip.muss { border-color: var(--accent); color: var(--accent); }
  .chip.late { border-color: var(--warn); color: var(--warn); }
  .chip.ok { border-color: var(--ok); color: var(--ok); }
  .note { background: transparent; border: 1px dashed var(--line); border-radius: 16px; padding: 14px 16px; color: var(--soft); font-size: 16px; }
  form { display: grid; gap: 12px; margin-top: 18px; }
  label { font-size: 14px; color: var(--soft); display: grid; gap: 5px; }
  input {
    font: inherit; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); width: 100%;
  }
  button {
    font: inherit; font-weight: 600; padding: 14px 16px; border-radius: 12px; border: 0;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.quiet { background: transparent; color: var(--soft); border: 1px solid var(--line); font-weight: 500; }
  button.link { background: none; border: 0; color: var(--soft); font-weight: 500; padding: 8px 0; text-decoration: underline; }
  .msg { color: var(--warn); font-size: 15px; min-height: 1.4em; }
  footer { margin-top: 34px; color: var(--soft); font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="login" hidden>
    <div class="eyebrow">Was jetzt?</div>
    <h1>Anmelden</h1>
    <p class="meta">Einmal anmelden, danach bleibt die App offen.</p>
    <form id="loginForm">
      <label>E-Mail
        <input id="email" type="email" autocomplete="username" inputmode="email" required>
      </label>
      <label>Passwort
        <input id="password" type="password" autocomplete="current-password" minlength="8" required>
      </label>
      <button type="submit">Anmelden</button>
      <button type="button" class="quiet" id="signup">Zum ersten Mal hier: Konto anlegen</button>
      <div class="msg" id="loginMsg" role="status"></div>
    </form>
  </section>

  <section id="day" hidden>
    <div class="hero">
      <svg viewBox="0 0 80 80" aria-hidden="true">
        <path d="M40 8c17 0 30 11 30 30 0 20-12 34-30 34S10 58 10 38C10 19 23 8 40 8z" fill="var(--blob)"/>
        <ellipse cx="24" cy="46" rx="6" ry="4" fill="var(--cheek)" opacity=".7"/>
        <ellipse cx="56" cy="46" rx="6" ry="4" fill="var(--cheek)" opacity=".7"/>
        <circle cx="30" cy="38" r="3.4" fill="#3b2c35"/>
        <circle cx="50" cy="38" r="3.4" fill="#3b2c35"/>
        <circle cx="31.2" cy="36.8" r="1.1" fill="#fff"/>
        <circle cx="51.2" cy="36.8" r="1.1" fill="#fff"/>
        <path d="M35 46q5 5 10 0" fill="none" stroke="#3b2c35" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M58 12l2.2 4.6 4.8.9-3.6 3.3.8 4.9-4.2-2.5-4.2 2.5.8-4.9-3.6-3.3 4.8-.9z" fill="#ffd66b"/>
      </svg>
      <div>
        <div class="eyebrow" id="weekday"></div>
        <h1 id="date"></h1>
      </div>
    </div>
    <p class="meta" id="hello"></p>
    <p class="meta" id="meta"></p>
    <div id="items"></div>
    <footer>
      <span id="stamp"></span>
      <button class="link" id="logout">Abmelden</button>
    </footer>
  </section>

  <section id="blocked" hidden>
    <div class="eyebrow">Was jetzt?</div>
    <h1>Kein Zugang</h1>
    <p class="meta">Diese App gehört schon jemandem, und dieses Konto ist es nicht.</p>
    <button class="quiet" id="logout2">Abmelden</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const SUPABASE_URL = 'https://xdnueixnfxakgqzelssm.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_G5mnIXDjHziriAnWgTL9yw_OG02MWwB';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });

  const $ = (id) => document.getElementById(id);
  const show = (id) => ['login', 'day', 'blocked'].forEach((s) => { $(s).hidden = s !== id; });
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  function daysLate(due, today) {
    if (!due) return 0;
    return Math.round((new Date(today) - new Date(due)) / 86400000);
  }

  function render(data) {
    const d = new Date(data.date + 'T12:00:00');
    $('weekday').textContent = d.toLocaleDateString('de-DE', { weekday: 'long' });
    $('date').textContent = d.toLocaleDateString('de-DE', { day: 'numeric', month: 'long' });

    const h = new Date().getHours();
    $('hello').textContent = h < 5 ? 'Noch wach? Schön, dass du da bist. 🌙'
      : h < 11 ? 'Guten Morgen, Sara. ☀️'
      : h < 14 ? 'Hallo Sara, schon was gegessen? 🥪'
      : h < 18 ? 'Hallo Sara, schön, dass du reinschaust. 🌸'
      : 'Guten Abend, Sara. 🌙';

    const items = data.items || [];
    if (data.source === 'plan') {
      const open = items.filter((i) => !i.done).length;
      $('meta').textContent = open === 0
        ? 'Alles von heute ist erledigt.'
        : (items.length === 1 ? 'Heute ist ein Punkt dran.' : 'Heute sind ' + items.length + ' Punkte dran.');
    } else {
      $('meta').textContent = 'Für heute gibt es noch keinen Plan. Das sind deine aktiven Projekte mit ihrem nächsten Schritt.';
    }

    const box = $('items');
    box.replaceChildren();
    if (!items.length) {
      box.append(el('div', 'note', 'Es ist nichts offen. Wenn das nicht stimmt, fehlt ein Plan oder ein aktives Projekt.'));
    }
    for (const it of items) {
      const card = el('div', 'item' + (it.done ? ' done' : ''));
      const proj = el('div', 'project');
      const emoji = { arbeit: '💼', privat: '🌷', haushalt: '🧺' }[it.area] || '✨';
      proj.append(el('span', 'tag ' + (it.area || ''), emoji + ' ' + (it.area || 'sonstiges')), el('span', null, it.project || 'Ohne Projekt'));
      card.append(proj, el('div', 'text', it.text));
      const chips = el('div', 'chips');
      if (it.done) chips.append(el('span', 'chip ok', 'erledigt'));
      if (it.muss) chips.append(el('span', 'chip muss', 'muss heute'));
      if (it.duration_min) chips.append(el('span', 'chip', it.duration_min + ' Min'));
      const late = daysLate(it.due, data.date);
      if (late > 0) chips.append(el('span', 'chip late', late === 1 ? 'seit gestern fällig' : 'seit ' + late + ' Tagen fällig'));
      if (chips.children.length) card.append(chips);
      box.append(card);
    }
    $('stamp').textContent = 'Stand ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  }

  async function load() {
    const { data: isOwner, error: claimErr } = await db.rpc('app_claim');
    if (claimErr) { show('login'); $('loginMsg').textContent = 'Die Datenbank antwortet nicht. Versuch es gleich nochmal.'; return; }
    if (!isOwner) { show('blocked'); return; }
    const { data, error } = await db.rpc('app_today');
    if (error) {
      show('day');
      $('items').replaceChildren(el('div', 'note', 'Der Tag konnte nicht geladen werden. Zieh die Seite neu oder versuch es gleich nochmal.'));
      return;
    }
    render(data);
    show('day');
  }

  async function start() {
    const { data: { session } } = await db.auth.getSession();
    if (session) await load(); else show('login');
  }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('loginMsg').textContent = 'Einen Moment …';
    const { error } = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
    if (error) {
      $('loginMsg').textContent = /confirm/i.test(error.message)
        ? 'Die Adresse ist noch nicht bestätigt. Schau in dein Postfach und klick den Link.'
        : 'Das hat nicht geklappt. Stimmen Adresse und Passwort?';
      return;
    }
    $('loginMsg').textContent = '';
    await load();
  });

  $('signup').addEventListener('click', async () => {
    const email = $('email').value.trim(), password = $('password').value;
    if (!email || password.length < 8) { $('loginMsg').textContent = 'Trag oben eine Adresse und ein Passwort mit mindestens acht Zeichen ein.'; return; }
    $('loginMsg').textContent = 'Einen Moment …';
    const { data, error } = await db.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
    if (error) { $('loginMsg').textContent = 'Das Konto konnte nicht angelegt werden: ' + error.message; return; }
    if (data.session) { $('loginMsg').textContent = ''; await load(); }
    else $('loginMsg').textContent = 'Fast fertig: Du hast eine Mail bekommen. Klick den Link darin und melde dich danach hier an.';
  });

  const logout = async () => { await db.auth.signOut(); show('login'); };
  $('logout').addEventListener('click', logout);
  $('logout2').addEventListener('click', logout);

  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || $('day').hidden) return;
    const { data, error } = await db.rpc('app_today');
    if (!error) render(data);
  });

  start();
})();
</script>
</body>
</html>
